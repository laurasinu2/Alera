<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2F84D8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Alera" />
  <meta name="description" content="Alera — planificación semanal, práctica y revisiones espaciadas para aprender idiomas." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preload" as="image" href="assets/brand/splash-loading.png" />
  <link rel="preload" as="image" href="assets/brand/splash-welcome.png" />
  <style>
    #boot-splash{position:fixed;inset:0;z-index:10000;background:#f8fbff;display:grid;place-items:stretch;opacity:1;visibility:visible;transition:opacity .28s ease,visibility .28s ease}#boot-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}#boot-splash img{width:100%;height:100%;object-fit:cover;display:block}
  </style>
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Alera</title>
</head>
<body>
  <div id="boot-splash" aria-hidden="true"><img src="assets/brand/splash-loading.png" alt=""></div>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
